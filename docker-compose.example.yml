services:
  ptpilot:
    build: .
    container_name: ptpilot
    restart: unless-stopped
    ports:
      - "8900:8900"
    volumes:
      # 配置与数据
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      # 运行日志(容器内 /data/logs,即宿主 ./data/logs);如需单独目录可改为 - ./logs:/data/logs
      - ./data/logs:/data/logs
      # 下载目录与媒体库(示例,按实际路径修改)
      # ⚠️ 必须与 qBittorrent 容器的挂载路径一致(两边看到相同的 /data/downloads、/data/media 等),
      #    整理服务不做宿主↔容器路径映射
      - /path/to/downloads:/data/downloads
      - /path/to/media:/data/media
    environment:
      - TZ=Asia/Shanghai
      # 可选:覆盖 config.yaml 里的 server.token
      # - PTPILOT_TOKEN=***
    # TMDB 域名解析异常时(如 DNS 污染),可用 extra_hosts 固定解析:
    # extra_hosts:
    #   - "api.themoviedb.org:3.170.103.81"

  # Jackett:PT 站索引聚合器,辅种模块(reseed)的搜索后端
  # 首次部署:mkdir -p jackett/{config,downloads},启动后打开 http://<host>:9117 配置索引器,
  # 再把 API key 填入 ptpilot 的 config.yaml(jackett.api_key)。
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    ports:
      - "9117:9117"                 # WebUI/API
    volumes:
      - ./jackett/config:/config    # Jackett 配置(ServerConfig.json / Indexers.json,含索引器凭据)
      - ./jackett/downloads:/downloads   # 可选:torrent 黑洞下载目录(当前未用)
    environment:
      - TZ=Asia/Shanghai
      # PUID/PGID:容器内进程用户/组 ID,与 ptpilot 保持一致(0=root)或按需调整
      - PUID=0
      - PGID=0
      # 可选:自动更新 Jackett 本体(linuxserver 镜像默认开启,可显式关掉)
      # - AUTO_UPDATE=false
