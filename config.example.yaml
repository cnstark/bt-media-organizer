# bt-media-organizer 配置文件示例
# 复制为 config.yaml 后按需修改;支持环境变量覆盖(见 README)

server:
  host: "0.0.0.0"
  port: 8900
  token: "change-me"            # API 鉴权,请务必修改

engine:
  threads: 2                    # 单次整理内文件并发数
  rename:
    movie: "{{title}}{% if year %} ({{year}}){% endif %}/{{title}}{% if year %} ({{year}}){% endif %}{% if part %}-{{part}}{% endif %}{% if quality %} - {{quality}}{% endif %}{{ext}}"
    tv: "{{title}}{% if year %} ({{year}}){% endif %}/{{season_dir}}/{{title}} - {{season_episode}}{% if part %}-{{part}}{% endif %}{{ext}}"
    s0_alias: ["Specials", "SPs"]   # 第 0 季目录名(取第一个)
    subtitle_lang_tag: true     # 字幕文件追加语言标记
  default_overwrite: never      # never / always / size / latest
  min_filesize: 0               # MB,0=不限制
  exclude_words: []             # 全局整理屏蔽词(路径命中即跳过)
  media_exts: [".mkv", ".mp4", ".ts", ".iso", ".avi", ".wmv", ".rmvb", ".mov", ".m2ts"]
  subtitle_exts: [".srt", ".ass", ".ssa", ".sub", ".idx"]
  audio_exts: [".mka", ".flac", ".aac", ".dts", ".ac3", ".wav", ".eac3"]
  tmp_exts: [".part", ".download", ".!qb", ".torrent"]   # 下载中/临时后缀
  delete_empty_source_dirs: true  # move 模式下整理完清理源空目录

directories:                    # 下载目录 → 媒体库映射,按顺序匹配,命中即止
  - name: "电影下载"
    download_path: "/data/downloads/movies"
    library_path: "/data/media"
    transfer_type: hardlink     # move / copy / hardlink / softlink
    media_type: movie           # movie / tv / all
    category: ~                 # 固定类别子目录(如 "华语"),留空不建
    renaming: true              # false = 保持原文件名直接转移
    monitor: true               # 参与事件/轮询匹配
    overwrite_mode: ~           # 留空继承 engine.default_overwrite
    min_filesize: ~             # 留空继承 engine.min_filesize
    exclude_words: []           # 目录级屏蔽词,与全局合并

  - name: "剧集下载"
    download_path: "/data/downloads/tv"
    library_path: "/data/media"
    transfer_type: hardlink
    media_type: tv
    category: ~                 # 固定类别子目录(如 "华语"),留空不建
    category_folder: false      # true = 按类别自动建子目录,未识别归"未分类"
    category_rules: {}          # 可选,MP 格式(如: 纪录片: {genre_ids: "99"});留空用内置 MP 默认规则
    monitor: true

downloaders:                    # 支持 qbittorrent / transmission
  - name: qb
    type: qbittorrent
    url: "http://127.0.0.1:8080"
    username: "admin"
    password: "adminadmin"
    poll_interval: 60           # 秒;0 = 关闭轮询
    tag: "已整理"               # 整理完成标签(对账依据)
    torrent_path: ""            # 种子目录(转移功能用;qB=BT_backup 绝对路径,如 /config/qBittorrent/BT_backup)

  - name: tr
    type: transmission
    url: "http://127.0.0.1:9091"
    username: ""
    password: ""
    poll_interval: 0            # 0 = 不参与整理轮询
    tag: "已整理"
    torrent_path: ""            # TR 种子目录(转移读取种子文件的兜底路径)

# ---------- 功能 2:转移(可选,enabled=true 时 from/to 必填且不能相等) ----------
transfer:
  enabled: false
  poll_interval: 300            # 秒;0 = 关闭
  from_client: qb               # 来源下载器(做种所在)
  to_client: tr                 # 目标下载器(转移去向)
  delete_source: false          # 转移成功后删除来源种子(只删种子不删数据);风险项,首次请勿开启
  auto_start: true              # 转移后是否自动开始做种;false = 添加后暂停
  marker: empty                 # 标记规则: empty / tag / category(如 tag=已转移)
  path:
    convert_type: eq            # 路径转换: eq(相等) / sub(减前缀) / add(加前缀) / replace(替换)
    rules: ""                  # 多行文本,每行 "源前缀{#**#}目标前缀";为空=eq
    filter_paths: []            # 排除目录(前缀匹配),命中不转移
    selector_paths: []          # 仅转移命中目录(前缀匹配);与 filter 不得有交集

# ---------- 功能 3:辅种(可选,enabled=true 时 jackett 配置与白名单必填) ----------
reseed:
  enabled: false
  poll_interval: 3600           # 秒;0 = 关闭
  target_client: qb             # 注入目标下载器(可选任意已配置下载器)
  auto_start: false             # 注入后是否自动开始做种;默认 false = 暂停(校验后手动开始)
  check_on_add: false           # 注入后是否发 recheck 校验命令(qB)
  marker: category              # 标记规则: empty / tag / category
  matcher: jackett
  jackett:
    url: "http://127.0.0.1:9117"
    api_key: ""
    indexers: []                # 索引器白名单(必须显式配置,如 ["hhanclub", "hdfans"]);空 = 不辅种
    max_candidates: 20          # 每种子最多候选数
    size_tolerance: 0.02        # 候选大小容差比例(±2%)
    per_indexer_delay: 2.0      # 每索引器请求间隔(秒),防限速
  exclude_paths: []             # 这些目录内的做种不参与辅种(前缀匹配)

recognize:
  tmdb:
    enabled: false              # 需要 TMDB API key 才启用
    api_key: ""
    language: "zh-CN"          # 标题语言(zh-CN 优先中文译名)
    timeout: 10                 # 秒
    api_base: "https://api.themoviedb.org/3"  # 默认官方;网络不通可换镜像/自建反代
    proxy: ""                   # 如 http://192.168.1.1:7890,留空则读系统 HTTPS_PROXY

history:
  db: "/data/organizer.db"     # SQLite 路径;Docker 部署务必用挂载卷内绝对路径(如 /data/organizer.db),否则重建容器丢历史
  keep_days: 365                # 历史保留天数,0=永久

log:
  level: info                   # debug / info / warning / error
  file: "/data/logs/organizer.log"  # 日志文件路径,父目录自动创建;空 = 仅 stdout。docker 部署时挂载 logs 目录到宿主机便于 debug(见 docker-compose)
